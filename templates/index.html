<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare: Intelligent Medication & Adherence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .hero-header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            margin: 0 0 8px 0;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .hero-title p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .stats-badge span {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stats-badge small {
            font-size: 0.85rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .hero-header { flex-direction: column; text-align: center; gap: 20px; }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 25px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.92rem;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-block;
        }

        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-taken { background: #dcfce7; color: #15803d; }
        .badge-missed { background: #fee2e2; color: #b91c1c; }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btns button {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
            border-radius: 8px;
            box-shadow: none;
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #f8fafc;
        }

        .search-bar button {
            width: auto;
            padding: 0 25px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="hero-header">
        <div class="hero-title">
            <h1>SmartCare Hub</h1>
            <p>Intelligent Medication Reminders & Escalation Tracking System</p>
        </div>
        <div class="stats-badge">
            <span id="activeCount">0</span>
            <small>Active Doses</small>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Left Column: Registration & Scheduling Forms -->
        <div>
            <div class="panel">
                <h3>Patient Profile</h3>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="e.g. Sarah Jenkins">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="sarah@example.com">
                </div>
                <button class="btn" onclick="addUser()">Create Profile</button>
            </div>

            <div class="panel">
                <h3>Prescription Scheduler</h3>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="userId" placeholder="Enter Patient ID">
                </div>
                <div class="form-group">
                    <label>Medication Name</label>
                    <input type="text" id="medName" placeholder="e.g. Amoxicillin">
                </div>
                <div class="form-group">
                    <label>Dosage</label>
                    <input type="text" id="dosage" placeholder="e.g. 500mg">
                </div>
                <div class="form-group">
                    <label>Scheduled Time</label>
                    <input type="text" id="time" placeholder="e.g. 08:00 AM">
                </div>
                <button class="btn" onclick="addPrescription()">Schedule Dose</button>
            </div>
        </div>

        <!-- Right Column: Interactive Schedule & Adherence Monitoring -->
        <div>
            <div class="panel">
                <h3>Adherence Control Dashboard</h3>
                <div class="search-bar">
                    <input type="number" id="fetchUserId" placeholder="Enter Patient User ID to load schedule...">
                    <button class="btn" onclick="getPrescriptions()">Load Schedule</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Medication</th>
                                <th>Dosage</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="prescriptionTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">No prescription records loaded. Enter your User ID above.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function addUser() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        if(!username || !email) { alert('Please fill in all user fields.'); return; }
        
        const response = await fetch('/add_user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email })
        });
        const data = await response.json();
        alert(data.message);
    }

    async function addPrescription() {
        const user_id = document.getElementById('userId').value;
        const med_name = document.getElementById('medName').value;
        const dosage = document.getElementById('dosage').value;
        const time = document.getElementById('time').value;
        if(!user_id || !med_name || !dosage || !time) { alert('Please fill in all prescription fields.'); return; }

        const response = await fetch('/add_prescription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id, med_name, dosage, time })
        });
        const data = await response.json();
        alert(data.message);
        getPrescriptions();
    }

    async function getPrescriptions() {
        const userId = document.getElementById('fetchUserId').value;
        if(!userId) { alert('Please enter a User ID.'); return; }

        const response = await fetch(`/get_prescriptions/${userId}`);
        const prescriptions = await response.json();
        const tbody = document.getElementById('prescriptionTableBody');
        tbody.innerHTML = '';

        document.getElementById('activeCount').innerText = prescriptions.length;

        if(prescriptions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No prescriptions found for this user ID.</td></tr>';
            return;
        }

        prescriptions.forEach(p => {
            let badgeClass = 'badge-pending';
            if(p.status === 'TAKEN') badgeClass = 'badge-taken';
            if(p.status === 'MISSED') badgeClass = 'badge-missed';

            tbody.innerHTML += `<tr>
                <td>#${p.id}</td>
                <td><strong>${p.med_name}</strong></td>
                <td>${p.dosage}</td>
                <td>${p.time}</td>
                <td><span class="badge ${badgeClass}">${p.status}</span></td>
                <td>
                    <div class="action-btns">
                        <button class="btn btn-success" onclick="updateStatus(${p.id}, 'TAKEN')">Taken</button>
                        <button class="btn btn-danger" onclick="deletePrescription(${p.id})">Delete</button>
                    </div>
                </td>
            </tr>`;
        });
    }

    async function updateStatus(id, status) {
        await fetch(`/update_prescription/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        getPrescriptions();
    }

    async function deletePrescription(id) {
        if(confirm('Are you sure you want to delete this prescription?')) {
            await fetch(`/delete_prescription/${id}`, {
                method: 'DELETE'
            });
            getPrescriptions();
        }
    }
</script>

</body>
</html>
